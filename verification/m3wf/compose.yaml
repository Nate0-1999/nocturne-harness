name: nocturne-m3wf
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    ports:
      - "127.0.0.1:55436:5432"
    environment:
      POSTGRES_USER: m3wf
      POSTGRES_PASSWORD: m3wf-fixture
      POSTGRES_DB: m3wf
    volumes:
      - m3wf-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m3wf -d m3wf"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  m3wf-data:
