[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nocturne-ai"
dynamic = ["version"]
description = "NOCTURNE local harness, onboarding CLI, and Memory Palace client"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "nocturne-spine==0.1.5",
  "playwright==1.62.0",
  "pydantic>=2.10,<3",
  "pydantic-ai==2.12.0",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
harness = "harness.daemon:main"
nocturne = "harness.cli:main"

[project.urls]
Homepage = "https://github.com/Nate0-1999/nocturne"
Source = "https://github.com/Nate0-1999/nocturne-harness"

[tool.hatch.version]
path = "src/harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "harness/_web"

[tool.hatch.build.targets.sdist.force-include]
"web/dist" = "web/dist"

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/README.md",
  "/pyproject.toml",
  "/src/harness",
  "/web/dist",
]

[tool.uv.sources]
nocturne-spine = { path = "../spine", editable = true }

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "contract: requires the live Spine and pgvector stack started by tests/contract/run.sh",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
