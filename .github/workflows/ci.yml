name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    name: Feature impact and handoff evidence
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0
      - name: Read canonical Garden ledger
        uses: actions/checkout@v4
        with:
          repository: Nate0-1999/nocturne-garden
          path: garden
          fetch-depth: 0
          ssh-key: ${{ secrets.GARDEN_READ_KEY }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nate0-1999/nocturne-memory
          path: spine
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute impact and verify DONE handoffs
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base=$(git -C harness merge-base origin/main HEAD)
          fi
          python garden/bin/ledger ci --repo harness "$base..HEAD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feature-impact
          path: harness/verification/*/impacted.json

  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lockstep Spine
        uses: actions/checkout@v4
        with:
          repository: Nate0-1999/nocturne-memory
          ref: cd3628bb5150769ce52b85424662f1bb39a292a7
          path: _d3/spine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./_d3/spine
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check src tests
      - name: Verify test motivations
        run: python scripts/check_test_motivations.py
      - name: Verify lifecycle matrix
        run: pytest -q tests/test_lifecycle_matrix.py
      - name: Test
        run: pytest -m "not contract"
      - name: Build distributions and rebuild wheel from sdist
        run: |
          python -m pip install build
          python -m build --sdist --wheel
          python scripts/verify_sdist.py dist/nocturne_harness-*.tar.gz
          python -m pip wheel --no-deps --wheel-dir /tmp/nocturne-harness-sdist-wheel dist/nocturne_harness-*.tar.gz
          cmp dist/nocturne_harness-*.whl /tmp/nocturne-harness-sdist-wheel/nocturne_harness-*.whl
      - name: Verify installed rebuilt wheel outside the checkout
        run: |
          python -m venv /tmp/nocturne-wheel
          /tmp/nocturne-wheel/bin/python -m pip install /tmp/nocturne-harness-sdist-wheel/nocturne_harness-*.whl
          cd /tmp
          /tmp/nocturne-wheel/bin/python "$GITHUB_WORKSPACE/scripts/verify_wheel.py"

  web:
    name: Web lint, build, and UI canon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Checkout lockstep Spine for the UI canon
        uses: actions/checkout@v4
        with:
          repository: Nate0-1999/nocturne-memory
          ref: cd3628bb5150769ce52b85424662f1bb39a292a7
          path: _canon/spine
          persist-credentials: false
      - name: Install web dependencies
        run: npm ci
      - name: Install the UI canon fixture
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./_canon/spine
          python -m pip install -e ".[dev]"
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Standing rendered UI canon
        # Garden is private; its own CI validates the ledger on every push.
        # This job is browser regression coverage, never a packet handoff.
        run: npm run test:canon -- --ui-only
      - name: Verify committed release bundle
        working-directory: .
        run: git diff --exit-code -- web/dist

  contract:
    name: Live Spine contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Spine
        uses: actions/checkout@v4
        with:
          repository: Nate0-1999/nocturne-memory
          ref: cd3628bb5150769ce52b85424662f1bb39a292a7
          path: _contract/spine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./_contract/spine
          python -m pip install -e ".[dev]"
      - name: Run live S1-S2 contract
        env:
          SPINE_SOURCE_DIR: ${{ github.workspace }}/_contract/spine
        run: sh tests/contract/run.sh
