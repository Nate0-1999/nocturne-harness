name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout lockstep Spine
        uses: actions/checkout@v4
        with:
          repository: Nate0-1999/nocturne-spine
          ref: 1667f3cdceb4449abe0d3dfe0c9982121a4c1dcd
          path: _d3/spine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./_d3/spine
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check src tests
      - name: Verify test motivations
        run: python scripts/check_test_motivations.py
      - name: Verify lifecycle matrix
        run: pytest -q tests/test_lifecycle_matrix.py
      - name: Test
        run: pytest -m "not contract"
      - name: Build distributions and rebuild wheel from sdist
        run: |
          python -m pip install build
          python -m build --sdist --wheel
          python scripts/verify_sdist.py dist/nocturne_ai-*.tar.gz
          python -m pip wheel --no-deps --wheel-dir /tmp/nocturne-ai-sdist-wheel dist/nocturne_ai-*.tar.gz
          cmp dist/nocturne_ai-*.whl /tmp/nocturne-ai-sdist-wheel/nocturne_ai-*.whl
      - name: Verify installed rebuilt wheel outside the checkout
        run: |
          python -m venv /tmp/nocturne-wheel
          /tmp/nocturne-wheel/bin/python -m pip install ./_d3/spine /tmp/nocturne-ai-sdist-wheel/nocturne_ai-*.whl
          cd /tmp
          /tmp/nocturne-wheel/bin/python "$GITHUB_WORKSPACE/scripts/verify_wheel.py"

  web:
    name: Web lint, build, and UI canon
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Checkout lockstep Spine for the UI canon
        uses: actions/checkout@v4
        with:
          repository: Nate0-1999/nocturne-spine
          ref: 1667f3cdceb4449abe0d3dfe0c9982121a4c1dcd
          path: _canon/spine
          persist-credentials: false
      - name: Install web dependencies
        run: npm ci
      - name: Install the UI canon fixture
        working-directory: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./_canon/spine
          python -m pip install -e ".[dev]"
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Standing rendered UI canon
        run: npm run test:canon
      - name: Verify committed release bundle
        working-directory: .
        run: git diff --exit-code -- web/dist

  contract:
    name: Live Spine contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Spine
        uses: actions/checkout@v4
        with:
          repository: Nate0-1999/nocturne-spine
          ref: 1667f3cdceb4449abe0d3dfe0c9982121a4c1dcd
          path: _contract/spine
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./_contract/spine
          python -m pip install -e ".[dev]"
      - name: Run live S1-S2 contract
        env:
          SPINE_SOURCE_DIR: ${{ github.workspace }}/_contract/spine
        run: sh tests/contract/run.sh
