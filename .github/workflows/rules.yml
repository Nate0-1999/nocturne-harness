name: Rules
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Frozen axioms and SPEC
        run: python scripts/check_rules.py --freeze-only
      - name: Decision citations and product vocabulary
        run: python scripts/check_rules.py
      - name: Guard citations and quoted refusal messages
        run: python scripts/check_guard_citations.py
      - name: Test motivations
        run: python scripts/check_test_motivations.py
      - name: Product voice and bridge boundaries
        run: node --experimental-strip-types --test web/tests/surfaceHonesty.test.mjs web/tests/chromeDiet.test.mjs web/tests/rackBridge.test.mjs web/tests/coreGuards.test.mjs
